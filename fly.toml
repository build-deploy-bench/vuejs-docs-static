# Fly.io config for the build-deploy benchmark. Create the app with `fly apps create <name>`, then deploy with
# `fly deploy --config fly.toml --app <name> --build-arg BENCH_COMMIT=<sha> --env BENCH_RUN_ID=<id>`. The app name
# is passed by the harness, not stored here. Fly has no static hosting product, so Caddy serves the built site
# from a Machine (see Dockerfile).
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  # One always-on Machine: a stopped Machine is updated but not started by `fly deploy`,
  # which would hide the boot from the deploy measurement.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Same path as the Railway health check. flyctl waits for this check before it reports the deploy done.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "5s"
    timeout = "2s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
